<!DOCTYPE html>
<html>
<head>
<title>Square Area Calculator</title>
</head>

<body style="text-align:center;font-family:Arial;margin-top:100px;">

<h2>Square Area Calculator</h2>

<input type="number" id="side" placeholder="Enter side length">

<br><br>

<button onclick="calc()">Calculate</button>

<h3 id="result"></h3>

<script>
function calc(){
let s=document.getElementById("side").value;
document.getElementById("result").innerText="Area = "+(s*s);
}
</script>

</body>
</html>
